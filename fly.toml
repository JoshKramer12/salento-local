app = "salento-local-josh-20260728"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_DATA_ROOT = "/data"
  PERSISTENT_ROOT = "/data"
  PORT = "8080"

[[mounts]]
  source = "salento_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
